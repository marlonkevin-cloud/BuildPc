{% extends 'base.html' %}
{% block title %}Entrar{% endblock %}
{% block content %}
<section class="secao">
  <div class="container form-wrap">
    <div class="form-card">
      <h1>Entre ou cadastre-se</h1>
      <p class="muted">Preencha seus dados para salvar seus setups.</p>
      <form method="get" action="{% url 'core:login' %}" class="form">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" placeholder="Ex.: Maria da Silva" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="voce@email.com" required>

        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999" pattern="[0-9()\s+-]{8,20}" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" minlength="6" required>

        <button type="submit" class="btn btn--primario btn--bloco">Entrar</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
